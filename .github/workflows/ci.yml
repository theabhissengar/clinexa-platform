name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    # Placeholder only — prisma generate does not open a DB connection.
    # Not a secret; runtime still requires a real DATABASE_URL via app config.
    # Postgres concurrency specs skip here unless RUN_POSTGRES_INTEGRATION=1
    # and a reachable database is provided.
    env:
      DATABASE_URL: postgresql://clinexa:clinexa@127.0.0.1:5432/clinexa_ci?schema=public
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_APP_NAME: Clinexa Internal Management
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate -w @clinexa/api

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test API
        run: npm run test:api

      - name: Build
        run: npm run build
