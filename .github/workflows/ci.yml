name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate -w @clinexa/api
        env:
          DATABASE_URL: postgresql://clinexa:clinexa@localhost:5432/clinexa?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test API
        run: npm run test:api

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://clinexa:clinexa@localhost:5432/clinexa?schema=public
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
